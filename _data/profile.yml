short_bio: >-
  <p>
    I am a master's student in mathematics at the University of Michigan. I've also recently decided to pursue a master's in applied economics for professional reasons.
    My focus in primarily monetary economics and policy, however, I am also interested in other areas, such as utility theory, behavioral economics, and labor economics.
    Math interests include measure theory, topology, topological data analysis, and stochastic processes. I post some of my individual research here. 
  </p>
  <div class="h6 mt-5">Brief Biography</div>
  <p
    I am currently a research assistant at the Medical Informatics Collaboration Unit (MCU) of <a href="https://yuhs.severance.healthcare/yuhs-en/index.do" target="_blank">Yonsei University Health System (YUHS)</a> in Seoul, Republic of Korea. 

    From August 2024 to February 2025, I was a visiting scholar at the <a href="https://www.cs.cmu.edu/" target="_blank">CMU School of Computer Science</a> as part of the <a href="https://www.msit.go.kr/eng/bbs/view.do?sCode=eng&mId=4&mPid=2&bbsSeqNo=42&nttSeqNo=697" target="_blank">Carnegie Mellon University Intensive AI Education Program</a> sponsored by the South Korean government.
  </p>

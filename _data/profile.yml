short_bio: >-
  <p>
    Hallo! I am very bad a these things, but I am Marthe Olivia Harme Forus (yes, I have four names). I have a bachelors in Mathematics from the Univerisity of Oslo and I am a master's student at the University of Michigan. I've also recently decided to pursue a master's in applied economics for professional reasons.
    Iam not sure if I want to pursue a PhD in the future; however, hopefully this portfolio will help me expand and discover my research interests.
  </p>
  <p>
  My primary research interests involves monetary economics and utility theory, however, I am also interested in the following areas
  <ul>
    <li>
    <b>Behavioral Economics:</b> Social preferences, rationality, environmental behavior.
    </li>
    <li>
    <b>Labor Economics:</b> Applied microeconometric methods, labor supply theory.
    </li>
    <li>
    <b>Topology:</b> Topological data analysis, geometric machine learning, manifold learning.
    </li>
    <li>
    <b>Stochastic Processes:</b> Stochastic differential equations, stochastic geometry, asset pricing.
    </li>
  </ul>
  </p>

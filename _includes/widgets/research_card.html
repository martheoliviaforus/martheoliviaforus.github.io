{% assign item = include.item %}
<div class="row no-gutters {% unless include.hide_bottom_border %}border-bottom{% endunless %} border-gray">
    <div class="col-md-4 col-xl-3 mb-0 p-2 p-md-3 d-flex align-items-center">
        {% if item.cover %}
        <img src="{{ item.cover | relative_url }}" alt="{{ item.title }}" class="w-100 rounded-sm research-preview-img" loading="lazy">
        {% else %}
        <div class="w-100 rounded-sm research-preview-placeholder" aria-hidden="true"></div>
        {% endif %}
    </div>
    <div class="col-md-8 col-xl-9 p-2 p-md-3 pl-md-0">
        <h6 class="mt-0 mb-1 font-weight-normal">
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </h6>
        <p class="mt-0 mb-1 small text-muted">{{ item.date | date: "%B %d, %Y" }}</p>
        {% if item.intro %}
        <p class="mt-0 mb-0 small text-muted">{{ item.intro }}</p>
        {% endif %}
        {% if item.tags.size > 0 %}
        <p class="mt-1 mb-0 small">
            {% for tag in item.tags %}
            <span class="badge badge-secondary mr-1">{{ tag }}</span>
            {% endfor %}
        </p>
        {% endif %}
    </div>
</div>
